# CI — build + MUnit. Thin caller that delegates to the shared reusable workflow
# (avatansh/mule-ci-cd), so every repo runs the exact same pipeline. Single-module
# repo: no module-path needed. Pin @main to a tag (e.g. @v1) once mule-ci-cd is released.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

jobs:
  munit:
    uses: avatansh/mule-ci-cd/.github/workflows/munit.yml@main
    secrets: inherit
